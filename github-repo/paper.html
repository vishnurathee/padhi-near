<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample paper · Padhaai Neev</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="paper">
  <header class="bar">
    <a class="logo" href="index.html">Padhaai <span>Neev</span></a>
    <a class="text-link" href="dashboard.html">Dashboard</a>
  </header>
  <main class="paper-layout">
    <aside class="paper-side">
      <p class="timer" id="timer">03:00:00</p>
      <button type="button" id="start-paper" class="solid">Start paper</button>
      <p class="fine" id="timer-note">Press Start paper. The clock does not run before that.</p>
      <h1 class="paper-title">Sample paper <span>2026–27</span></h1>
      <div class="dash-line"></div>
      <p class="cheer">Read it once. Write it clean.</p>
      <p class="cheer">Three hours. Every mark is yours.</p>
      <p class="done-line">Done <strong id="done-count">0 / 8</strong></p>
      <button type="button" id="check-paper">Check at the end</button>
    </aside>
    <section class="paper-scroll" id="paper-list"></section>
  </main>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
